name: CI Security & Quality Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-checks:
    name: Frontend Quality & Security Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Next.js Optimized Build Check
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-test-mock.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_mock_anon_key_for_build_testing
          SUPABASE_SERVICE_ROLE_KEY: ci_mock_service_role_key_for_build_testing
          INTERNAL_API_KEY: f49c83a8f77acd625223d740ae06db19a679df1904aa1b4df924c24e0c234573

      - name: Run Offline Security & Logic Unit Tests
        run: npm test

  backend-checks:
    name: Backend Security, Liveness & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Minimal Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless Pillow python-dotenv fastapi starlette pydantic supabase

      - name: Run Backend Offline Unit Tests
        run: python -m unittest discover backend/tests

      - name: Run Anti-Spoofing & Liveness Fail-Closed Tests
        run: python backend/test_antispoof.py

      - name: Run Safe Attendance Insert Schema Validator
        run: python backend/test_insert.py
